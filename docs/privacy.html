    SL.start(T, function (lang, t) {
      document.getElementById("date").textContent = UPDATED;
      document.getElementById("intro").textContent = t("intro");
      var box = document.getElementById("sections");
      box.textContent = "";
      var list = t("sections");
      list.forEach(function (x, i) {
        var sec = document.createElement("section");
        var h = document.createElement("h2");
        h.textContent = x[0];
        var p = document.createElement("p");
        if (i === list.length - 1) {
          if (CONTACT) {
            if (/^https?:\/\//.test(CONTACT)) {
              var a = document.createElement("a");
              a.href = CONTACT; a.textContent = CONTACT; p.appendChild(a);
            } else {
              var m = document.createElement("a");
              m.href = "mailto:" + CONTACT; m.textContent = CONTACT; p.appendChild(m);
            }
          } else {
            var td = document.createElement("span");
            td.className = "todo";
            td.textContent = t("todo");
            p.appendChild(td);
          }
        } else {
          p.innerHTML = x[1];
        }
        sec.appendChild(h);
        sec.appendChild(p);
        box.appendChild(sec);
      });
    });
