    var GLYPHS = [
      '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 5v22M10 5h12M10 27h12"/></svg>',
      '<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="6" width="24" height="20" rx="4"/><path d="M7 22l6-7 4 5 3-3 5 5"/><circle cx="22" cy="12" r="2"/></svg>',
      '<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11"/><path d="M16 9v7l5 3"/></svg>'
    ];
    var COLORS = ["#4285F4", "#EA4335", "#FBBC05", "#4285F4", "#34A853", "#EA4335"];

    var input = document.getElementById("demo-input");
    var stage = document.getElementById("stage");
    var touched = false;

    function chars(s) {
      if (window.Intl && Intl.Segmenter) {
        return Array.from(new Intl.Segmenter(undefined, { granularity: "grapheme" }).segment(s), function (x) { return x.segment; });
      }
      return Array.from(s);
    }
    function units(list) {
      var u = 0;
      list.forEach(function (c) {
        u += /[ᄀ-ᇿ぀-ヿ㄰-㆏㐀-鿿가-힯＀-￯]/.test(c) ? 1 : 0.6;
      });
      return Math.max(u, 1);
    }
    function drawLogo() {
      var list = chars(input.value);
      stage.textContent = "";
      var w = Math.max(stage.clientWidth - 24, 160);
      stage.style.fontSize = Math.min(72, w / units(list)) + "px";
      var i = 0;
      list.forEach(function (c) {
        var s = document.createElement("span");
        s.textContent = c;
        if (/\s/.test(c)) { s.style.whiteSpace = "pre"; }
        else { s.style.color = COLORS[i++ % COLORS.length]; }
        stage.appendChild(s);
      });
    }

    input.addEventListener("input", function () { touched = true; drawLogo(); });
    window.addEventListener("resize", drawLogo);

    function el(tag, text, cls) {
      var e = document.createElement(tag);
      if (text !== undefined) e.textContent = text;
      if (cls) e.className = cls;
      return e;
    }

    SL.start(T, function (lang, t) {
      if (!touched) input.value = t("demoDefault");
      drawLogo();

      var cta = document.getElementById("cta");
      if (STORE_URL) {
        cta.href = STORE_URL;
        cta.textContent = t("cta");
        cta.classList.remove("off");
        cta.removeAttribute("aria-disabled");
      } else {
        cta.removeAttribute("href");
        cta.textContent = t("ctaSoon");
        cta.classList.add("off");
        cta.setAttribute("aria-disabled", "true");
      }

      var chips = document.getElementById("chips");
      chips.textContent = "";
      t("chips").forEach(function (c) {
        var b = el("button", c, "chip");
        b.type = "button";
        b.addEventListener("click", function () { touched = true; input.value = c; drawLogo(); });
        chips.appendChild(b);
      });

      var f = document.getElementById("features");
      f.textContent = "";
      t("features").forEach(function (x, i) {
        var li = document.createElement("li");
        var g = el("div", undefined, "glyph");
        g.innerHTML = GLYPHS[i];
        var body = document.createElement("div");
        body.appendChild(el("h3", x[0]));
        body.appendChild(el("p", x[1]));
        li.appendChild(g);
        li.appendChild(body);
        f.appendChild(li);
      });

      var s = document.getElementById("steps");
      s.textContent = "";
      t("steps").forEach(function (x) { s.appendChild(el("li", x)); });

      var sc = document.getElementById("scope");
      sc.textContent = "";
      t("scope").forEach(function (x) { sc.appendChild(el("li", x)); });

      var q = document.getElementById("faq");
      q.textContent = "";
      t("faq").forEach(function (x) {
        var d = document.createElement("details");
        d.appendChild(el("summary", x[0]));
        d.appendChild(el("p", x[1]));
        q.appendChild(d);
      });
    });
  </script>
</body>
</html>
